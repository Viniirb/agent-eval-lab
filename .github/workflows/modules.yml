name: Validar módulo

# PR de uma branch `modulo/NN-nome`: valida o módulo NN (o mesmo scripts/validate-module.sh que você roda local).
# Push na branch `reference`: valida TODOS os módulos (garante que a solução e os testes batem).
# Manual (Actions > Run workflow): boletim de todos os módulos na branch escolhida.
on:
  pull_request:
    branches: [main]
  push:
    branches: [reference]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modulos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integridade:
    name: Integridade
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Testes, tipos, scripts e automação não podem ser alterados
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Adicionar arquivos novos (tasks/002..., .github/workflows/benchmark.yml, testes seus) é permitido.
          # Modificar ou apagar testes existentes, scripts, workflows, tipos ou configuração é bloqueado.
          changed=$(git diff --name-status --diff-filter=MDR "$BASE_SHA" "$HEAD_SHA" \
            | awk '{print $NF}' \
            | grep -E '^(tests/|scripts/|\.github/|tasks/001-|src/types\.ts$|src/todo\.ts$|src/cli\.ts$|package(-lock)?\.json$|tsconfig\.json$|vitest\.config\.ts$|agents\.example\.json$)' || true)
          if [ -n "$changed" ]; then
            echo "::error::Estes arquivos não podem ser modificados em um PR de módulo:"
            echo "$changed"
            exit 1
          fi
          echo "Nenhum arquivo protegido foi alterado."

  detectar:
    name: Detectar módulos
    runs-on: ubuntu-latest
    outputs:
      modulos: ${{ steps.escolher.outputs.modulos }}
    steps:
      - id: escolher
        env:
          EVENTO: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          todos='["00","01","02","03","04","05","06","07","08","09","10","11","12","13","14","15","16"]'
          if [ "$EVENTO" = "pull_request" ]; then
            if [[ "$HEAD_REF" =~ ^modulo/([0-9]{2})- ]]; then
              echo "modulos=[\"${BASH_REMATCH[1]}\"]" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Branch '$HEAD_REF' não segue o padrão modulo/NN-nome; nada a validar."
              echo "modulos=[]" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "modulos=$todos" >> "$GITHUB_OUTPUT"
          fi

  validar:
    name: Validar módulo ${{ matrix.modulo }}
    needs: detectar
    if: needs.detectar.outputs.modulos != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        modulo: ${{ fromJSON(needs.detectar.outputs.modulos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validar
        run: scripts/validate-module.sh "${{ matrix.modulo }}"
